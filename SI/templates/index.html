<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index ERP | Intelligence Login</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<style>
    :root {
        --obsidian: #0b0e14;
        --cyan-primary: #00f2ff;
        --cyan-glow: rgba(0, 242, 255, 0.3);
        --glass: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    body {
        background-color: var(--obsidian);
        background-image:
            radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.07) 0%, transparent 40%),
            radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.07) 0%, transparent 40%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .login-container {
        perspective: 1000px;
        animation: fadeIn 1s ease-out;
    }

    .glass-card {
        background: var(--glass);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid var(--glass-border);
        border-radius: 28px;
        padding: 3.5rem 3rem;
        width: 420px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        position: relative;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .glass-card:hover {
        border-color: rgba(0, 242, 255, 0.5);
        transform: translateY(-5px);
        box-shadow: 0 30px 60px rgba(0, 242, 255, 0.1);
    }

    /* New Brain Icon Styling */
    .brain-icon-wrapper {
        text-align: center;
        margin-bottom: 1.5rem;
    }

    .brain-svg {
        width: 60px;
        height: 60px;
        filter: drop-shadow(0 0 15px var(--cyan-primary));
        animation: pulseBrain 2.5s infinite ease-in-out;
    }

    h1 {
        color: #fff;
        font-weight: 800;
        letter-spacing: 5px;
        font-size: 1.8rem;
        margin-bottom: 0.2rem;
        text-align: center;
    }

    .welcome-text {
        color: #aaa;
        font-size: 0.85rem;
        text-align: center;
        margin-bottom: 2.5rem;
        letter-spacing: 1px;
    }

    .input-group {
        position: relative;
        margin-bottom: 1.8rem;
    }

    .input-group input {
        width: 100%;
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        outline: none;
        color: #fff;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .input-group label {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
        pointer-events: none;
        transition: all 0.3s ease;
    }

    .input-group input:focus,
    .input-group input:valid {
        border-color: var(--cyan-primary);
        background: rgba(0, 242, 255, 0.01);
        box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);
    }

    .input-group input:focus~label,
    .input-group input:valid~label {
        top: -10px;
        left: 12px;
        font-size: 0.75rem;
        color: var(--cyan-primary);
        background: #0b0e14;
        padding: 0 8px;
        font-weight: 600;
    }

    .login-btn {
        width: 100%;
        padding: 16px;
        background: var(--cyan-primary);
        border: none;
        border-radius: 12px;
        color: #000;
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 10px 20px rgba(0, 242, 255, 0.2);
    }

    .login-btn:hover {
        transform: scale(1.02);
        box-shadow: 0 0 30px var(--cyan-primary);
        filter: brightness(1.1);
    }

    .footer-links {
        margin-top: 2rem;
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
    }

    .footer-links a {
        color: #777;
        text-decoration: none;
        transition: color 0.3s;
    }

    .footer-links a:hover {
        color: var(--cyan-primary);
    }

    .accent-link {
        color: var(--cyan-primary) !important;
        font-weight: 600;
    }

    /* Animations */
    @keyframes pulseBrain {

        0%,
        100% {
            transform: scale(1);
            opacity: 0.9;
        }

        50% {
            transform: scale(1.1);
            opacity: 1;
            filter: drop-shadow(0 0 25px var(--cyan-primary));
        }
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 480px) {
        .glass-card {
            width: 90%;
            padding: 2.5rem 1.5rem;
        }
    }
</style>

<body>
    <div class="login-container">
        <div class="glass-card">
            <div class="brain-icon-wrapper">
                <svg class="brain-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M32 8C20.5 8 11 17.5 11 29C11 37.6 14.5 45.5 20.3 51C21.4 51.9 22.8 52.7 24.4 53.3C26.8 54.3 29.6 54.9 32 54.9C34.4 54.9 37.2 54.3 39.6 53.3C41.2 52.7 42.6 51.9 43.7 51C49.5 45.5 53 37.6 53 29C53 17.5 43.5 8 32 8Z"
                        stroke="#00f2ff" stroke-width="2" />
                    <path d="M32 15V22M22 18L26 22M42 18L38 22" stroke="#00f2ff" stroke-width="2"
                        stroke-linecap="round" />
                    <circle cx="32" cy="32" r="6" fill="#00f2ff" fill-opacity="0.3" stroke="#00f2ff" stroke-width="1" />
                </svg>
                <h1>INDEX ERP</h1>
            </div>
            <p class="welcome-text">NEUARL VAULT</p>

            <form action="/login" method="POST">
                <div class="input-group">
                    <input type="text" name="username" required autocomplete="off">
                    <label>Username</label>
                </div>
                <div class="input-group">
                    <input type="password" name="password" required>
                    <label>Password</label>
                </div>

                <button type="submit" class="login-btn">L O G I N</button>

                <div class="footer-links">
                   <!-- <a href="#">Security Reset</a> -->
                    <a href="http://localhost/Clg_att/htdocs/index.php" target="_blank" class="accent-link">Attendance
                        Live</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>

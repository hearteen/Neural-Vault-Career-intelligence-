<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index ERP | Edit Student Node</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        /* Textbox visibility fix */
        .form-control {
            background: rgba(10, 11, 14, 0.8) !important; /* Dark Obsidian */
            color: #ffffff !important;
            border: 1px solid rgba(0, 255, 255, 0.2) !important;
        }

        .form-control:focus {
            border-color: #00ffff !important;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3) !important;
        }

        /* Custom Cyan Blink/Glow Animation */
        @keyframes cyan-glow-pulse {
            0% { box-shadow: 0 0 5px #00ffff; transform: scale(1); }
            50% { box-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff; transform: scale(1.02); }
            100% { box-shadow: 0 0 5px #00ffff; transform: scale(1); }
        }

        .btn-update-node {
            background-color: #00ffff !important;
            color: #0a0b0e !important;
            border: none !important;
            transition: all 0.3s ease;
            animation: cyan-glow-pulse 2s infinite ease-in-out;
        }

        .btn-update-node:hover {
            background-color: #ffffff !important;
            animation: none;
            box-shadow: 0 0 40px #00ffff;
        }

        /* Input Group Icon Styling */
        .input-group-text {
            background: rgba(0, 255, 255, 0.1) !important;
            border: 1px solid rgba(0, 255, 255, 0.2) !important;
            color: #00ffff !important;
        }
    </style>
</head>

<body class="bg-obsidian text-white">

    {% include 'header.html' %}

    <div class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="glass-card-premium p-5 border-cyan-low animate__animated animate__zoomIn">
                    
                    <div class="text-center mb-4">
                        <div class="card-icon-box text-cyan mx-auto mb-3 shadow-glow-cyan">
                            <i class="fas fa-user-edit"></i>
                        </div>
                        <h3 class="fw-bold text-cyan">Edit Student Node</h3>
                        <p class="text-muted-custom small">Synchronizing modifications with Neural Core...</p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label small text-muted-custom">Roll Number (System ID)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-fingerprint"></i></span>
                                <input type="text" class="form-control text-muted" value="{{ student.roll_no }}" readonly>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" name="name" class="form-control" 
                                       value="{{ student.name }}" placeholder="Enter full name" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small">Department</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-university"></i></span>
                                <input type="text" name="department" class="form-control" 
                                       value="{{ student.department }}" placeholder="e.g. MCS, BCA" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small">Current GPA Score</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-chart-line"></i></span>
                                <input type="number" step="0.01" name="gpa" class="form-control" 
                                       value="{{ student.gpa }}" placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-update-node w-100 py-2 fw-bold">
                                <i class="fas fa-save me-2"></i>Update Node
                            </button>
                            <a href="/dashboard" class="btn btn-outline-secondary w-100 py-2">
                                <i class="fas fa-times me-2"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

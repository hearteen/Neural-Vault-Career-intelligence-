<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Vault | Academic Records</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --sidebar-width: 280px;
            --cyber-black: #02040a; 
            --neon-cyan: #00f2ff; 
            --neon-purple: #bc13fe;
            --glass-bg: rgba(2, 4, 10, 0.85);
            --row-bg: rgba(255, 255, 255, 0.03);
            --sidebar-bg: #050810;
        }

        /* Base Reset */
        body { 
            background-color: var(--cyber-black) !important; 
            color: #e2e8f0; 
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding-left: var(--sidebar-width);
            overflow-x: hidden;
            transition: padding 0.3s ease;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        /* --- SIDEBAR STYLING --- */
        .main-sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            position: fixed;
            left: 0; top: 0;
            border-right: 1px solid rgba(0, 242, 255, 0.1);
            display: flex;
            flex-direction: column;
            z-index: 1050;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link-custom {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-radius: 12px;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        .nav-link-custom i {
            width: 30px;
            font-size: 1.1rem;
            color: var(--neon-cyan);
            filter: drop-shadow(0 0 5px var(--neon-cyan));
        }

        .nav-link-custom:hover, .nav-link-custom.active-glow {
            background: rgba(0, 242, 255, 0.05);
            color: #fff;
            transform: translateX(8px);
            box-shadow: -5px 0 0 var(--neon-cyan);
        }

        /* --- MOBILE TOGGLE & OVERLAY --- */
        .mobile-nav-toggle {
            position: fixed;
            top: 15px; left: 15px;
            z-index: 1100;
            background: var(--sidebar-bg);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px 15px;
            border-radius: 8px;
            display: none;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1040;
            display: none;
            backdrop-filter: blur(4px);
        }

        /* --- MAIN CONTENT STYLING --- */
        .main-content { padding: 3rem; max-width: 1200px; margin: 0 auto; }
        .cyber-header {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(to right, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Data Rows & Marks */
        .sem-block { margin-bottom: 4rem; }
        .data-row {
            background: var(--row-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 18px 25px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: 0.3s ease;
        }
        .data-row:hover {
            border-color: var(--neon-cyan);
            transform: scale(1.01) translateX(5px);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        }

        .tag-pass { color: #00ff88; font-weight: 700; font-size: 0.75rem; }
        .tag-fail { color: #ff4d4d; font-weight: 700; font-size: 0.75rem; }
        .gpa-display { font-family: 'Orbitron'; color: var(--neon-cyan); font-size: 1.5rem; }

        /* Responsive Breakpoints */
        @media (max-width: 992px) {
            body { padding-left: 0 !important; }
            .mobile-nav-toggle { display: block; }
            .main-sidebar { transform: translateX(-100%); }
            .main-sidebar.active { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .main-content { padding: 5rem 1.5rem 2rem; }
        }
    </style>
</head>
<body>

    <button class="mobile-nav-toggle" id="sidebarToggle">
        <i class="fas fa-bars"></i>
    </button>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="main-sidebar animate__animated animate__fadeInLeft" id="mainSidebar">
        <div class="sidebar-logo px-4 py-4 mb-4">
            <div class="d-flex align-items-center">
                <i class="fas fa-brain text-cyan pulse-animation me-3" style="font-size: 2.2rem; color: var(--neon-cyan);"></i>
                <div class="d-flex flex-column">
                    <span class="fw-bold text-white mb-0" style="font-size: 1.2rem; font-family: 'Orbitron';">
                        Neural <span style="color: var(--neon-cyan);">Vault</span>
                    </span>
                    <small class="text-uppercase text-muted" style="font-size: 0.55rem; letter-spacing: 2px;">Core Interface</small>
                </div>
            </div>
        </div>

        <nav class="sidebar-nav flex-grow-1 px-3">
            {% if session.get('role') == 'admin' %}
                <a href="/dashboard" class="nav-link-custom">
                    <i class="fas fa-th-large"></i> Admin Panel
                </a>
                <a href="/register_students" class="nav-link-custom">
                    <i class="fas fa-users"></i> Register Students
                </a>
            {% else %}
                <a href="/student_dashboard" class="nav-link-custom">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="/semester_marks" class="nav-link-custom active-glow">
                    <i class="fas fa-poll"></i> Semester Marks
                </a>
                <a href="/academic_trajectory" class="nav-link-custom">
                    <i class="fas fa-chart-line"></i> Trajectory
                </a>
                <a href="/career_insight" class="nav-link-custom">
                    <i class="fas fa-lightbulb"></i> AI Insight
                </a>
            {% endif %}
        </nav>

        <div class="sidebar-footer px-3 py-4">
            <a href="/logout" class="nav-link-custom" style="color: #ff4444;">
                <i class="fas fa-sign-out-alt"></i> Terminate Session
            </a>
        </div>
    </aside>

    <script>
        const sidebar = document.getElementById('mainSidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        const overlay = document.getElementById('sidebarOverlay');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('show');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('show');
        });

        // Close menu on link click (Mobile)
        document.querySelectorAll('.nav-link-custom').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 992) {
                    sidebar.classList.remove('active');
                    overlay.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>
